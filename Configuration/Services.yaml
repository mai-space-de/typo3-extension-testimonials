services:
  _defaults:
    autowire: true
    autoconfigure: true
    public: false

  Maispace\MaiTestimonials\:
    resource: '../Classes/*'
    exclude: '../Classes/Domain/Model/*'

  Maispace\MaiTestimonials\Indexer\TestimonialsIndexer:
    tags:
      - name: 'maispace.search.indexer'
      - name: 'maispace.search.result_formatter'

  dashboard.widget.maiTestimonialsManual:
    class: 'ProudNerds\PnBackendManual\Widgets\ManualWidget'
    arguments:
      $options:
        file: 'EXT:mai_testimonials/Resources/Private/Manual/Manual.md'
        numbered: true
        contentsDepth: 2
        printButton: true
    tags:
      - name: dashboard.widget
        identifier: 'maiTestimonialsManual'
        groupNames: 'documentation'
        title: 'Handbuch: Stimmen'
        description: 'Kurze Anleitung für Zitate.'
        iconIdentifier: 'content-book'
        height: 'medium'
        width: 'medium'
